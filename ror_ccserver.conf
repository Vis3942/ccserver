 
  upstream ccserver {
    server 127.0.0.1:3000;
  } 

  server {
    listen 443;
    server_name plscentral.com;

    ssl on;
    ssl_certificate       /etc/ssl/certs/plscentral_server.crt;
    ssl_certificate_key   /etc/ssl/certs/plscentral_server.key; 


    location / {
      proxy_pass http://ccserver;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
    } 
  }

